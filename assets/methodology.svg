<svg xmlns="http://www.w3.org/2000/svg" width="640" height="800" viewBox="0 0 640 800" role="img" aria-labelledby="title description">
  <title id="title">Encoding defines connections. Matching checks when they apply.</title>
  <desc id="description">Public sources enter LLM-assisted research and review in guide-pack-kit. The reviewed facts, investor topics, startup lessons and contexts are encoded as guide-pack.json. Using the included or an explicitly activated pack, startup-guide JavaScript combines that library with your situation and investor lens. A supported match can produce a next move and its evidence. Without a supported connection there is no investor-linked next move, while a startup-only example or general prompt may still appear.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#507256" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
  <rect x="1" y="1" width="638" height="798" rx="24" fill="#f5f2e8" stroke="#dcd7c8"/>
  <g stroke="#b4c191" stroke-width="1.5">
    <rect x="100" y="22" width="440" height="58" rx="14" fill="#fffdf6"/>
    <rect x="45" y="118" width="550" height="130" rx="20" fill="#e7edd6"/>
    <rect x="45" y="294" width="360" height="80" rx="14" fill="#fffdf6"/>
    <rect x="425" y="294" width="170" height="80" rx="14" fill="#e8eef1"/>
    <rect x="45" y="470" width="550" height="120" rx="20" fill="#e7edd6"/>
    <rect x="30" y="646" width="280" height="96" rx="16" fill="#e7edd6"/>
    <rect x="330" y="646" width="280" height="96" rx="16" fill="#f4e8d7"/>
  </g>
  <g fill="none" stroke="#507256" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)">
    <path d="M320 80v29"/><path d="M320 248v20H225v17"/>
    <path d="M225 374v54H320v32"/><path d="M510 374v54H320"/>
    <path d="M320 590v26H170v20"/><path d="M320 616H470v20"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#1c4938">
    <text x="320" y="59" font-size="25">Public sources</text>
    <text x="320" y="157" font-size="29" font-weight="700">1. Encode &amp; review</text>
    <text x="320" y="192" font-size="23">guide-pack-kit · LLM-assisted</text>
    <text x="320" y="224" font-size="21">Research · criteria · suggestions</text>
    <text x="225" y="327" font-size="24">guide-pack.json</text>
    <text x="225" y="355" font-size="18">Reviewed · included or imported</text>
    <text x="510" y="320" font-size="20">Your situation</text>
    <text x="510" y="349" font-size="20">+ investor lens</text>
    <text x="320" y="508" font-size="29" font-weight="700">2. Match rules</text>
    <text x="320" y="543" font-size="23">startup-guide · JavaScript</text>
    <text x="320" y="573" font-size="21">Context + topic + evidence</text>
    <text x="170" y="677" font-size="21" font-weight="700">Supported match</text>
    <text x="170" y="713" font-size="23">Next move + basis</text>
    <text x="470" y="675" font-size="21" font-weight="700">No supported connection</text>
    <text x="470" y="705" font-size="22">No investor-linked</text>
    <text x="470" y="730" font-size="22">next move</text>
    <text x="320" y="778" font-size="19">Startup-only examples or general prompts may appear.</text>
  </g>
</svg>
