<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f5f2e8">
<title>Startup Guide</title><link rel="stylesheet" href="css/style.css?v=a14cd6d86514"><link rel="manifest" href="manifest.json"><link rel="icon" href="icons/icon-192.png">
</head>
<body>
<div class="guide-app">
  <header class="app-header"><a href="docs/guide.html" aria-label="Startup Guide help">s.</a><span>Startup Guide</span><small id="pack-label">Local guide</small></header>
  <main id="screen-content">
    <h1 id="screen-title" tabindex="-1">Your situation</h1>
    <section data-screen="situation" aria-labelledby="screen-title">
      <p class="intro">Start with what you know.</p>
      <form id="situation-form" class="stack">
        <label for="business-model">What are you building?</label>
        <select id="business-model" required><option value="">Choose a business model</option><option value="marketplace">A marketplace</option><option value="service">A service business</option><option value="saas">Software / SaaS</option><option value="hardware">Hardware</option><option value="consumer_product">A consumer product</option><option value="other">Something else</option><option value="unknown">Not sure yet</option></select>
        <label for="current-stage">Where are you now?</label>
        <select id="current-stage" required><option value="">Choose your stage</option><option value="pre-company">Before company formation</option><option value="idea">Exploring an idea</option><option value="pre-seed">Testing with users / pre-seed</option><option value="seed">Seed stage</option><option value="series-a">Series A</option><option value="growth">Growing / later stage</option><option value="unknown">Not sure yet</option></select>
        <label for="validation-focus">What do you need next?</label>
        <select id="validation-focus" required><option value="">Choose your next question</option><option value="customer_problem">Understand customer problems</option><option value="demand">Test demand</option><option value="operations">Test service operations</option><option value="technical_feasibility">Test technical feasibility</option><option value="investor_outreach">Explore investor conversations</option><option value="unknown">Not sure yet</option></select>
        <button class="primary" id="save-situation">Show my next move →</button>
      </form>
    </section>
    <section data-screen="move" hidden aria-labelledby="screen-title">
      <div data-step="move" class="card move-card">
        <p id="move-kind" class="eyebrow"></p><h2 id="move-title"></h2><p id="move-support" class="support"></p><p id="move-reason"></p>
        <button id="move-action" class="primary">Make a plan</button>
        <div id="move-links"><button id="move-evidence" class="text-button">Why this fits &amp; sources</button></div>
        <small id="support-note" class="muted"></small>
      </div>
      <form id="plan-form">
        <div data-step="plan" hidden class="stack">
          <p id="plan-review" class="review" role="status"></p>
          <label for="plan-action">What will you try?</label><textarea id="plan-action" rows="2" maxlength="12000"></textarea>
          <label for="plan-evidence">What will you look for?</label><textarea id="plan-evidence" rows="2" maxlength="12000"></textarea>
          <button class="primary" id="save-plan">Save plan &amp; continue →</button>
          <div class="row"><button id="plan-back" type="button" class="text-button">← Next move</button></div>
        </div>
        <div data-step="learn" hidden class="stack">
          <label for="plan-status">Progress</label><select id="plan-status"><option value="todo">To explore</option><option value="in_progress">Trying</option><option value="evidence_recorded">Learning recorded</option></select>
          <label for="plan-notes">What did you learn?</label><textarea id="plan-notes" rows="2" maxlength="12000"></textarea>
          <label for="plan-outcome">What next?</label><select id="plan-outcome"><option value="unreviewed">Not reviewed yet</option><option value="continue">Continue</option><option value="change">Change the approach</option><option value="stop">Stop</option></select>
          <div class="row"><button id="learning-back" type="button" class="text-button">← Edit plan</button><button id="save-learning" type="button" class="primary">Save progress</button></div>
        </div>
      </form>
    </section>
    <section data-screen="investor" hidden aria-labelledby="screen-title">
      <div class="card"><p id="investor-kind" class="eyebrow"></p><h2 id="investor-name"></h2><p id="investor-focus"></p><p id="investor-reason" class="support"></p><button id="choose-investor" class="primary">Use this perspective</button><button id="investor-details" class="text-button">Profile &amp; sources</button></div>
      <div class="pager"><button id="investor-prev" aria-label="Previous investor">←</button><span id="investor-count"></span><button id="investor-next" aria-label="Next investor">→</button></div>
    </section>
    <section data-screen="startup" hidden aria-labelledby="screen-title">
      <div class="card"><p id="startup-kind" class="eyebrow"></p><h2 id="startup-name"></h2><p id="startup-date" class="muted"></p><p id="startup-action"></p><p id="startup-limit" class="support"></p><button id="startup-details" class="text-button">Full snapshot &amp; sources</button></div>
      <div class="pager"><button id="startup-prev" aria-label="Previous startup">←</button><span id="startup-count"></span><button id="startup-next" aria-label="Next startup">→</button></div>
    </section>
  </main>
  <p id="fatal-error" role="alert" hidden></p>
  <footer><p id="app-status" role="status"></p><nav aria-label="Main navigation"><button data-view="situation" aria-pressed="true">Situation</button><button data-view="move" aria-pressed="false">Next move</button><button data-view="investor" aria-pressed="false">Investor</button><button data-view="startup" aria-pressed="false">Startup</button></nav></footer>
</div>
<dialog id="evidence-dialog" aria-labelledby="detail-title"><header><h2 id="detail-title">Sources</h2><button id="close-details">Close</button></header><div id="detail-body"></div></dialog>
<script src="packs/active-pack.js"></script><script defer src="js/app.bundle.js?v=a14cd6d86514"></script>
</body></html>
